<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Marmotte Buchhaltung</title>
<link rel="icon" href="assets/favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5f4f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Buchhaltung">
<link rel="stylesheet" href="https://bakerymarmotte-cmyk.github.io/marmotte-design/marmotte.css">
<link rel="stylesheet" href="style.css">
<script src="https://bakerymarmotte-cmyk.github.io/marmotte-design/theme.js"></script>
<script src="https://bakerymarmotte-cmyk.github.io/marmotte-design/icons.js" defer></script>
</head>
<body>

<div class="topbar no-print">
  <div class="brand">
    <div class="brand-logo"><i data-icon="croissant"></i></div>
    <div>
      <div class="brand-name">Marmotte</div>
      <div class="brand-sub">Buchhaltung</div>
    </div>
  </div>
  <div class="who">
    <span class="name" id="user-name-label"></span>
    <button class="m-theme-btn" data-theme-toggle aria-label="Hell/Dunkel umschalten"></button>
    <button class="logout-btn" id="logout-btn" aria-label="Abmelden"><i data-icon="log-out" data-size="16"></i></button>
  </div>
</div>

<div class="nav-wrap no-print">
<nav class="main-nav" id="main-nav">
  <button data-tab="erfassen" class="active"><span class="icon"><i data-icon="pencil"></i></span>Erfassen</button>
  <button data-tab="uebersicht"><span class="icon"><i data-icon="printer"></i></span>Übersicht &amp; Druck</button>
  <button data-tab="kassen"><span class="icon"><i data-icon="wallet"></i></span>Kassen</button>
</nav>
</div>

<main>

  <!-- ERFASSEN -->
  <section class="tab-panel active" id="panel-erfassen">
    <div class="day-nav">
      <button class="round-btn" id="tag-zurueck" aria-label="Vorheriger Tag"><i data-icon="chevron-left" data-size="18"></i></button>
      <input type="date" id="tag" class="day-input">
      <button class="round-btn" id="tag-vor" aria-label="Nächster Tag"><i data-icon="chevron-right" data-size="18"></i></button>
    </div>
    <p class="hint-text center" id="tag-label"></p>

    <p class="hint-text" id="keine-kassen" style="display:none;">Es sind noch keine Kassen angelegt. Lege sie zuerst unter «Kassen» an.</p>
    <div id="erfassen-list"></div>

    <div class="save-bar" id="save-bar" style="display:none;">
      <div class="error-text" id="erfassen-error"></div>
      <button class="btn btn-primary" id="erfassen-speichern" style="width:100%;"><i data-icon="save" data-size="16"></i> Tag speichern</button>
      <p class="hint-text center" style="margin-top:8px;">Leere Felder bei einer Kasse = für diesen Tag kein Eintrag.</p>
    </div>
  </section>

  <!-- ÜBERSICHT & DRUCK -->
  <section class="tab-panel" id="panel-uebersicht">
    <div class="card form-card no-print">
      <div class="form-row-3">
        <div class="field"><label for="von">Von</label><input type="date" id="von"></div>
        <div class="field"><label for="bis">Bis</label><input type="date" id="bis"></div>
        <div class="field">
          <label for="filter-kasse">Kasse</label>
          <select id="filter-kasse"><option value="">Alle Kassen</option></select>
        </div>
      </div>
      <div class="quick-row">
        <button class="chip-btn" data-range="monat">Dieser Monat</button>
        <button class="chip-btn" data-range="vormonat">Letzter Monat</button>
        <button class="chip-btn" data-range="jahr">Dieses Jahr</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="anzeigen"><i data-icon="search" data-size="16"></i> Anzeigen</button>
        <button class="btn btn-primary" id="drucken"><i data-icon="printer" data-size="16"></i> Drucken</button>
      </div>
    </div>

    <div id="report">
      <div class="print-head">
        <div class="ph-title">Marmotte – Tagesabschlüsse</div>
        <div class="ph-sub" id="report-sub"></div>
      </div>
      <div id="report-body"><p class="hint-text">Zeitraum wählen und «Anzeigen» tippen.</p></div>
      <div class="print-foot" id="report-foot"></div>
    </div>
  </section>

  <!-- KASSEN -->
  <section class="tab-panel" id="panel-kassen">
    <div class="card form-card">
      <h3 class="section-title" id="kasse-form-title">Neue Kasse</h3>
      <div class="field"><label for="kasse-name">Name</label><input type="text" id="kasse-name" maxlength="40" placeholder="z.B. Laden Kandersteg"></div>
      <div class="error-text" id="kasse-error"></div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="kasse-abbrechen" type="button" style="display:none;">Abbrechen</button>
        <button class="btn btn-primary" id="kasse-speichern" type="button">Kasse anlegen</button>
      </div>
    </div>
    <div id="kassen-list"></div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
